# Reboot automatically after a kernel oops instead of hanging until a manual
# power-cycle. On 2026-11-26 a NAS NIC stall triggered a CIFS/netfs oops on
# kernel 7.0.0-44, which soft-locked a CPU, leaked kernel memory into OOM and
# left the host unreachable (no SSH) until it was force-rebooted.
# Deploy: sudo install -m 644 sysctl.d/61-panic-reboot.conf /etc/sysctl.d/ && sudo sysctl --system
kernel.panic_on_oops = 1
kernel.panic = 10
