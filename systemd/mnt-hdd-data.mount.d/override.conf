# Drop-in for the fstab-generated NAS CIFS mount (/mnt/hdd/data).
# Deploy: sudo install -D -m 644 systemd/mnt-hdd-data.mount.d/override.conf \
#           /etc/systemd/system/mnt-hdd-data.mount.d/override.conf
#         sudo systemctl daemon-reload
#
# After a power cut this host boots before the router/NAS are reachable.
# x-systemd.automount retries the mount on every access to /mnt/hdd/data
# (dockerd, start-arr-stack.sh), but the default start limit (5 starts / 10s)
# tripped and left the automount failed until a manual reset-failed - on
# 2026-11-19 it tripped one second after the NAS came back. Each attempt
# already blocks ~6s on the CIFS connect timeout, so retrying without a
# limit cannot spin.
[Unit]
StartLimitIntervalSec=0
