# Tracked copy of the [tdarr-transcode] share appended to /etc/samba/smb.conf.
# Remote Tdarr nodes mount this as their transcode cache, so path must match the
# server's /temp mount (TDARR_TRANSCODE_ROOT in .env).
# Ubuntu release upgrades replace smb.conf with the stock file and drop this share;
# run scripts/check-samba.sh to verify it, and re-append this file if it is missing.

[tdarr-transcode]
   comment = Tdarr Transcode Cache
   path = /docker/appdata/tdarr/transcode
   browseable = yes
   read only = no
   guest ok = no
   valid users = harshal
   force user = harshal
   create mask = 0775
   directory mask = 0775
