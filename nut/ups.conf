[apc1500]
    driver = usbhid-ups
    port = auto
    desc = "APC Back-UPS RS 1500G-IN"
    # The UPS's own LB fires at 120 s / 10 %, far too late (2026-10-28 outage ran
    # ~1h47m on battery with no shutdown). Let the driver raise LB earlier instead.
    ignorelb
    override.battery.runtime.low = 600
    override.battery.charge.low = 25
